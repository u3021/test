<style>
  h3 {
    color:green;
  }
  h4 {
    color:red;
  }
</style>
<h1>this is test website.</h1>
<h2>
  <label for="eggs">enter egg here</label>
  <input type="text" 
    id="eggs"
    name="eggs" 
    required
    minlength="1"
    maxlength="4"
    size="10"
  />
</h2>
<h2>
  <label for="submit">submit eggs here</label>
  <input type="submit" id="submit" />
</h2>
<h4 id="output"></h4>
<script>
  function eggFunction(){
    document.getElementById("output").innerHTML = "<h3>yayy!! eggs correct!!!</h3>";
  };
  function eggCheck(){
    var egg = document.getElementById("eggs").value;
    if (egg === "eggs"){
      eggFunction();
    } else {
      document.getElementById("output").innerHTML = "<h4>incorrect egg.</h4>";
    };
  };
</script>
<button onclick="eggCheck()">egg ignite!11!!1!1</button>
